<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RaceTrack Designer</title>
    <meta
      name="description"
      content="Sketch a loop and turn it into a top-down racing track graphic, with kerbs, road and grass, ready to download as PNG or SVG."
    />
    <link rel="canonical" href="https://racetrack.viboko.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RaceTrack Designer" />
    <meta
      property="og:description"
      content="Sketch a loop and turn it into a top-down racing track graphic."
    />
    <meta property="og:url" content="https://racetrack.viboko.dev/" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-title" content="RaceTrack" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>
  <body>
    <header>
      <h1>RaceTrack Designer</h1>
      <p>Draw a loop to make a top-down racing track.</p>
    </header>

    <main>
      <div class="canvas-wrap">
        <canvas id="track-canvas" role="img" aria-label="Track drawing area"></canvas>
        <div id="hint" class="hint">Draw a loop</div>
      </div>

      <div class="toolbar">
        <label class="field">
          Road width
          <input id="width" type="range" step="1" />
        </label>
        <label class="check"><input id="start-line" type="checkbox" /> Start line</label>
        <label class="check"><input id="show-points" type="checkbox" checked /> Show points</label>
        <span class="spacer"></span>
        <button id="undo" type="button" title="Undo (Ctrl/Cmd+Z)">Undo</button>
        <button id="clear" type="button">Clear</button>
      </div>

      <div class="toolbar">
        <span class="label">Download</span>
        <button type="button" data-download="png" class="primary">PNG</button>
        <button type="button" data-download="svg" class="primary">SVG</button>
      </div>

      <p class="help">
        Drag to sketch a loop; the end joins back to the start. Then drag points to reshape,
        double-click the track to add a point, or double-click a point to remove it. The blue point
        marks the start line.
      </p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
